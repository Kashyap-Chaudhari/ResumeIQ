
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ResumeIQ</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom Styles -->

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  
</head>
<body>


  <div class="auth-wrapper">
    
<div class="auth-card">
    <div class="text-center mb-4">
        <div class="brand-logo-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 22px;">
            <i class="bi bi-rocket-takeoff-fill"></i>
        </div>
        <h3 class="fw-bold mt-2" style="color: var(--text-primary); letter-spacing: -0.5px;">Welcome Back</h3>
        <p class="text-secondary mb-0" style="font-size: 0.95rem;">Sign in to your ResumeIQ account</p>
    </div>

    <form method="POST" action="/login/" id="loginForm">
        <input type="hidden" name="csrfmiddlewaretoken" value="XgVGqafthheGzOSEZekAAy9sHffGPDwKEO7sksubYfTWI3AwdvjZdr6j9aEtBpRL">
        
        
        
        <div class="mb-3">
            <label for="id_username" class="form-label d-block fw-semibold mb-1" style="color: var(--text-primary); font-size: 0.85rem;">Username</label>
            <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username">
            
        </div>

        <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="id_password" class="form-label fw-semibold mb-0" style="color: var(--text-primary); font-size: 0.85rem;">Password</label>
                <a href="#" class="text-decoration-none" style="color: var(--accent-indigo); font-size: 0.8rem; font-weight: 500;">Forgot Password?</a>
            </div>
            <div class="password-wrapper">
                <input type="password" name="password" autocomplete="current-password" required id="id_password">
                <i class="bi bi-eye-slash-fill password-toggle" id="togglePassword" title="Show password"></i>
            </div>
            
        </div>

        <div class="mb-4 form-check d-flex align-items-center gap-2">
            
            <label class="form-check-label text-secondary" for="" style="font-size: 0.85rem;">
                
            </label>
        </div>
        
        <button type="submit" class="btn-saas-primary w-100 text-center py-2" id="loginBtn" style="font-size: 0.95rem; height: 44px;">
            <span class="btn-text">Sign In</span>
        </button>
    </form>
    
    <div class="text-center mt-4">
        <p class="text-secondary mb-0" style="font-size: 0.9rem;">Don't have an account? <a href="/register/" style="color: var(--accent-indigo); text-decoration: none; font-weight: 600;">Sign Up</a></p>
    </div>
</div>

<!-- Demo Account Card -->
<div class="mt-4 p-4 rounded-4" style="background: var(--bg-card); border: 1px dashed var(--border-color); max-width: 440px; margin: 0 auto; box-shadow: var(--shadow-sm);">
    <div class="d-flex align-items-center gap-2 mb-3">
        <i class="bi bi-info-circle-fill text-primary"></i>
        <h6 class="mb-0 fw-bold" style="color: var(--text-primary);">Demo Student Account</h6>
    </div>
    <div class="font-monospace p-3 rounded-3" style="background: var(--bg-main); font-size: 0.85rem; color: var(--text-secondary); border: 1px solid var(--border-color);">
        <div class="d-flex justify-content-between mb-2">
            <span>Email:</span> <span class="fw-bold" style="color: var(--text-primary);">demo@student.com</span>
        </div>
        <div class="d-flex justify-content-between mb-2">
            <span>Username:</span> <span class="fw-bold" style="color: var(--text-primary);">demo_student</span>
        </div>
        <div class="d-flex justify-content-between">
            <span>Password:</span> <span class="fw-bold" style="color: var(--text-primary);">Demo@123</span>
        </div>
    </div>
    <p class="text-muted mt-3 mb-0 text-center" style="font-size: 0.75rem;">Use these credentials to explore all application features.</p>
</div>

<style>
    .errorlist { color: var(--accent-rose, #ef4444); list-style: none; padding-left: 0; font-size: 0.8rem; margin-top: 5px; margin-bottom: 0; }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Password Toggle
    const togglePassword = document.querySelector('#togglePassword');
    const passwordInput = document.querySelector('#passwordInput');
    
    if (togglePassword && passwordInput) {
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('bi-eye-fill');
            this.classList.toggle('bi-eye-slash-fill');
        });
    }

    // Loading State
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    
    form.addEventListener('submit', function() {
        btn.classList.add('btn-loading');
    });
});
</script>

  </div>


<!-- Bootstrap 5 Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/main.js"></script>

</body>
</html>
